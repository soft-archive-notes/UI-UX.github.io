<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI/UX Process Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      box-sizing: border-box;
    }
    
    h1 {
      font-size: clamp(1.25rem, 4vw, 2rem);
      margin-top: 0;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
      word-wrap: break-word;
      width: 100%;
    }
    
    .diagram-container {
      width: 100%;
      max-width: 900px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background-color: #ffffff;
      padding: 12px;
      box-sizing: border-box;
      overflow-x: auto;
      margin: 0 auto;
    }
    
    img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h1>UI/UX BSIS 2B GROUP 1 Diagram</h1>

  <div class="diagram-container">
    <img src="UI_UX_BSIS_2B-Page-1.drawio.svg" alt="UI/UX BSIS 2B Group 1 Diagram">
  </div>

</body>
</html>
